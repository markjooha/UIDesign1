<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bldg 500</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="page">
    <header class="site-header" aria-label="Bldg 500 poster board">
      <a class="brand" href="#" aria-label="Bldg 500, College of Fine Arts home">
        <span class="brand-title">Bldg 500</span>
        <span class="brand-subtitle">College of Fine Arts</span>
      </a>

      <nav class="nav-links" aria-label="Page actions">
        <a href="#posters">Add Poster</a>
        <a class="is-active" href="../index.html">Go Back</a>
      </nav>
    </header>

    <div class="section-divider" aria-hidden="true"></div>

    <section class="poster-grid" id="posters" aria-label="Poster collection">
      <figure class="poster-card">
        <img src="assets/poster-1.png" alt="Poster 1" />
      </figure>
      <figure class="poster-card">
        <img src="assets/poster-2.png" alt="Poster 2" />
      </figure>
      <figure class="poster-card">
        <img src="assets/poster-3.png" alt="Poster 3" />
      </figure>
      <figure class="poster-card">
        <img src="assets/poster-4.png" alt="Poster 4" />
      </figure>
      <figure class="poster-card">
        <img src="assets/poster-5.png" alt="Poster 5" />
      </figure>
      <figure class="poster-card">
        <img src="assets/poster-6.png" alt="Poster 6" />
      </figure>
      <figure class="poster-card">
        <img src="assets/poster-7.png" alt="Poster 7" />
      </figure>
      <figure class="poster-card">
        <img src="assets/poster-8.png" alt="Poster 8" />
      </figure>
      <figure class="poster-card">
        <img src="assets/poster-9.png" alt="Poster 9" />
      </figure>
      <figure class="poster-card">
        <img src="assets/poster-10.png" alt="Poster 10" />
      </figure>
    </section>
  </main>
</body>

</html>
